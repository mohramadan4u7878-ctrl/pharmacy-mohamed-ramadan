
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>صيدليه د محمد رمضان</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial;background:#f1f5f9;margin:0;color:#183047}
header{background:#087e78;color:white;padding:20px;text-align:center}
main{max-width:650px;margin:20px auto;padding:15px}
.card{background:white;padding:18px;margin:12px 0;border-radius:12px;box-shadow:0 2px 8px #ddd}
input,button{box-sizing:border-box;width:100%;padding:13px;margin:7px 0;border-radius:7px;border:1px solid #ccc;font-size:16px}
button{background:#087e78;color:white;border:0;cursor:pointer}
h2{color:#087e78}
#app{display:none}
.small{color:#64748b;font-size:13px}
</style>
</head>
<body>
<header>
<h2 style="color:white">صيدليه د محمد رمضان</h2>
<p>نظام إدارة الصيدلية</p>
</header>
<main>
<section id="login" class="card">
<h2>تسجيل الدخول</h2>
<input id="email" type="email" placeholder="البريد الإلكتروني">
<input id="password" type="password" placeholder="كلمة المرور">
<button onclick="login()">دخول</button>
 <button onclick="forgotPassword()" style="background:#64748b">
نسيت كلمة المرور؟
</button>
<p id="message"></p>
</section>

<section id="app">
<div class="card">
<h2>القائمة الرئيسية</h2>
<button onclick="showProducts()">الأدوية والمخزون</button>
<button onclick="logout()">تسجيل الخروج</button>
</div>
<div class="card">
<h2>بحث عن دواء</h2>
<input id="search" placeholder="اسم الدواء أو الباركود" oninput="filterProducts()">
<div id="products"></div>
</div>
<div class="card">
<h2>إضافة دواء جديد</h2>
<input id="name" placeholder="اسم الدواء">
<input id="barcode" placeholder="الباركود">
<input id="unit" placeholder="الوحدة - علبة أو شريط">
<input id="units" type="number" placeholder="عدد الوحدات داخل العبوة">
<input id="sale" type="number" step="0.01" placeholder="سعر البيع">
<input id="purchase" type="number" step="0.01" placeholder="سعر الشراء">
<button onclick="addProduct()">حفظ الدواء</button>
<p id="addmessage"></p>
</div>
</section>
</main>
<script>
const SUPABASE_URL = "https://xmubnftwlifvtodagypq.supabase.co";
const SUPABASE_KEY = "sb_publishable_ocN6ChtTSgYb3RgegfQUaA_K-1PTRIY";
const db = supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let currentUser = null;
let allProducts = [];

async function login(){
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;
 const msg=document.getElementById("message");
 msg.textContent="جار تسجيل الدخول...";
 const {data,error}=await db.auth.signInWithPassword({email,password});
 if(error){msg.textContent="تعذر الدخول: "+error.message;return;}
 currentUser=data.user;
 document.getElementById("login").style.display="none";
 document.getElementById("app").style.display="block";
 showProducts();
}
async function forgotPassword(){
 const email=document.getElementById("email").value.trim();
 const msg=document.getElementById("message");

 if(!email){
  msg.textContent="اكتب البريد الإلكتروني أولاً";
  return;
 }

 msg.textContent="جار إرسال رابط استعادة كلمة المرور...";

 const {error}=await db.auth.resetPasswordForEmail(email,{
  redirectTo:"https://mohramadan4u7878-ctrl.github.io/pharmacy-mohamed-ramadan/"
 });

 if(error){
  msg.textContent="تعذر الإرسال: "+error.message;
 }else{
  msg.textContent="تم إرسال رابط الاستعادة إلى بريدك الإلكتروني. راجع صندوق الوارد.";
 }
}
async function logout(){
 await db.auth.signOut();
 location.reload();
}

async function showProducts(){
 const box=document.getElementById("products");
 box.textContent="جار تحميل الأدوية...";
 const {data,error}=await db.from("products")
 .select("id,name,barcode,unit,sale_price,purchase_price,units_per_pack")
 .order("name");
 if(error){box.textContent="خطأ في تحميل الأدوية: "+error.message;return;}
 allProducts=data||[];
 filterProducts();
}

function filterProducts(){
 const q=document.getElementById("search").value.trim().toLowerCase();
 const found=allProducts.filter(p=>
 (p.name||"").toLowerCase().includes(q)||
 (p.barcode||"").toLowerCase().includes(q)
 );
 const box=document.getElementById("products");
 box.innerHTML="";
 if(!found.length){box.textContent="لا توجد أدوية مطابقة";return;}
 found.forEach(p=>{
 const div=document.createElement("div");
 div.className="card";
 const name=document.createElement("b");
 name.textContent=p.name||"";
 const details=document.createElement("p");
 details.textContent="الباركود: "+(p.barcode||"-")+
 " | الوحدة: "+(p.unit||"-")+
 " | سعر البيع: "+(p.sale_price??"-");
 div.append(name,details);
 box.appendChild(div);
 });
}

async function addProduct(){
 const msg=document.getElementById("addmessage");
 if(!currentUser){msg.textContent="سجل الدخول أولاً";return;}
 const name=document.getElementById("name").value.trim();
 const barcode=document.getElementById("barcode").value.trim();
 const unit=document.getElementById("unit").value.trim();
 const units=document.getElementById("units").value;
 const sale=document.getElementById("sale").value;
 const purchase=document.getElementById("purchase").value;
 if(!name||!sale){msg.textContent="أدخل اسم الدواء وسعر البيع";return;}
 const {error}=await db.from("products").insert({
 name,barcode:barcode||null,unit:unit||"علبة",
 units_per_pack:Number(units)||1,
 sale_price:Number(sale),
 purchase_price:Number(purchase)||0,
 user_id:currentUser.id
 });
 if(error){msg.textContent="تعذر الحفظ: "+error.message;return;}
 msg.textContent="تم حفظ الدواء بنجاح";
 ["name","barcode","unit","units","sale","purchase"].forEach(id=>document.getElementById(id).value="");
 showProducts();
}

async function restoreSession(){
 const {data}=await db.auth.getSession();
 if(data.session){
 currentUser=data.session.user;
 document.getElementById("login").style.display="none";
 document.getElementById("app").style.display="block";
 showProducts();
 }
}
restoreSession();
</script>
</body>
</html>
